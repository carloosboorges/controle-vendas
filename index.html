<!-- Formulário de Venda -->
  <section class="panel panel-form">
    <h2>➕ Registrar Venda</h2>
    
    <!-- 1. Linha com dados da conta e cliente -->
    <div class="toolbar">
      <div class="field">
        <label>Conta utilizada</label>
        <select id="contaSelect"></select>
      </div>
      <div class="field">
        <label>Valor da venda</label>
        <input id="valorInput" type="number" min="0.01" step="0.01" placeholder="Ex.: 45,00">
      </div>
      <div class="field" style="max-width:180px;min-width:130px">
        <label>Quantidade de itens</label>
        <input id="quantidadeInput" type="number" min="1" step="1" value="1" oninput="atualizarCamposItens()">
      </div>
      <div class="field">
        <label>Nome do cliente</label>
        <input id="clienteInput" type="text" maxlength="80" placeholder="Ex.: João123">
      </div>
      <div class="field">
        <label>Nick do cliente</label>
        <input id="nickClienteInput" type="text" maxlength="80" placeholder="Ex.: JoaoFortnite">
      </div>
    </div>

    <!-- 2. Área de Seleção dos Itens Vendidos (Tipo + Nome) -->
    <div id="itensGroupContainer" class="itens-group-container" style="margin-top: 14px;">
      <!-- Gerado dinamicamente via JS -->
    </div>

    <!-- 3. Botões de Ação logo abaixo do item vendido -->
    <div class="form-actions-row" style="margin-top: 16px; display: flex; gap: 10px;">
      <button type="button" class="btn-primary" style="flex: 1;" onclick="adicionarVenda()">➕ Adicionar venda</button>
      <button type="button" class="btn-gray" id="limparValorBtn">🧹 Limpar</button>
    </div>

    <!-- 4. Valores Rápidos -->
    <div class="quick" style="margin-top: 14px;">
      <span class="small" style="align-self:center">Valores rápidos:</span>
      <button type="button" onclick="valorRapido(2.5)">R$ 2,50</button>
      <button type="button" onclick="valorRapido(10)">R$ 10</button>
      <button type="button" onclick="valorRapido(12.5)">R$ 12,50</button>
      <button type="button" onclick="valorRapido(20)">R$ 20</button>
      <button type="button" onclick="valorRapido(30)">R$ 30</button>
      <button type="button" onclick="valorRapido(37.5)">R$ 37,50</button>
      <button type="button" onclick="valorRapido(45)">R$ 45</button>
      <button type="button" onclick="valorRapido(50)">R$ 50</button>
      <button type="button" onclick="valorRapido(60)">R$ 60</button>
      <button type="button" onclick="valorRapido(75)">R$ 75</button>
      <button type="button" onclick="valorRapido(85)">R$ 85</button>
      <button type="button" onclick="valorRapido(90)">R$ 90</button>
      <button type="button" onclick="valorRapido(100)">R$ 100</button>
    </div>
  </section>
